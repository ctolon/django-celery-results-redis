[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "django-celery-results-redis"
dynamic = ["version"]
description = "Celery result backend for Django that stores results in Redis, with django-celery-results parity."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ctolon", email = "cevatbatuhan.tolon@gmail.com" }]
maintainers = [{ name = "ctolon", email = "cevatbatuhan.tolon@gmail.com" }]
keywords = ["django", "celery", "redis", "results", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "Django>=5.2",
    "celery>=5.5,<6",
    "redis>=5,<8",
]

[project.optional-dependencies]
redis-om = ["redis-om>=1.1,<2"]

[project.entry-points."celery.result_backends"]
django-redis-db = "django_celery_results_redis.backends:RedisResultBackend"

[project.urls]
Documentation = "https://ctolon.github.io/django-celery-results-redis/"
Source = "https://github.com/ctolon/django-celery-results-redis"
Changelog = "https://github.com/ctolon/django-celery-results-redis/blob/main/CHANGELOG.md"
Issues = "https://github.com/ctolon/django-celery-results-redis/issues"

[dependency-groups]
test = [
    "django-celery-results==2.6.0",
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.9",
    "pytest-xdist>=3.6",
    "redis-om>=1.1,<2",
    "time-machine>=2.14",
]
lint = [
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-include-markdown-plugin>=6.2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.hatch.version]
path = "django_celery_results_redis/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "django_celery_results_redis",
    "benchmarks",
    "scripts",
    "tests",
    "docs",
    "mkdocs.yml",
    "tox.ini",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["django_celery_results_redis"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: runs a real Celery worker",
]
filterwarnings = [
    "error::django.core.paginator.UnorderedObjectListWarning",
]

[tool.coverage.run]
source = ["django_celery_results_redis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py310"
line-length = 88
# Code blocks in the documentation are wrapped for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
# Field definitions mirror django-celery-results, which uses nullable text fields
# and gives ChordCounter no __str__.
"django_celery_results_redis/models.py" = ["DJ001", "DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["django_celery_results_redis", "tests"]
