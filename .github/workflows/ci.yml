name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uvx --with tox-uv tox -e lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked --group docs mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", tox: py310-django52}
          - {python: "3.11", tox: py311-django52}
          - {python: "3.12", tox: py312-django52}
          - {python: "3.13", tox: py313-django52}
          - {python: "3.14", tox: py314-django52}
          - {python: "3.12", tox: py312-django60}
          - {python: "3.13", tox: py313-django60}
          - {python: "3.14", tox: py314-django60}
          - {python: "3.12", tox: py312-django61}
          - {python: "3.13", tox: py313-django61}
          - {python: "3.14", tox: py314-django61}
          - {python: "3.13", tox: py313-django61-celery55}
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uvx --with tox-uv tox -e ${{ matrix.tox }}
        env:
          REDIS_URL: redis://localhost:6379/0
