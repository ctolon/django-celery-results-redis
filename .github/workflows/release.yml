name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' \
            django_celery_results_redis/__init__.py)
          tag=${GITHUB_REF_NAME#v}
          test "$version" = "$tag" || {
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          }
      - name: Check the changelog has a dated entry for the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF_NAME#v}
          grep -qE "^## ${tag} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${tag} (YYYY-MM-DD)' section"
            exit 1
          }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository == 'testpypi' && 'testpypi' || 'pypi' }}
      url: https://pypi.org/p/django-celery-results-redis
    permissions:
      id-token: write
    # With no API token secret configured, the action authenticates as a
    # trusted publisher through OIDC instead.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to PyPI
        if: inputs.repository != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Take the release notes from the changelog
        run: |
          tag=${GITHUB_REF_NAME#v}
          awk -v header="## ${tag} (" '
            index($0, header) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
