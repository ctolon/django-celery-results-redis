site_name: django-celery-results-redis
site_description: Celery result backend for Django that stores results in Redis
site_url: https://ctolon.github.io/django-celery-results-redis/
repo_url: https://github.com/ctolon/django-celery-results-redis
repo_name: ctolon/django-celery-results-redis
edit_uri: edit/main/docs/
copyright: BSD 3-Clause

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Migrating from django-celery-results: migration.md
      - Examples: examples.md
  - Guides:
      - Settings: settings.md
      - Storage drivers: drivers.md
      - Admin: admin.md
      - Performance: performance.md
      - FAQ: faq.md
  - Reference:
      - API: reference.md
      - Architecture: architecture.md
      - Parity with django-celery-results: admin-parity.md
  - Project:
      - Contributing: contributing.md
      - Testing: testing.md
      - Changelog: changelog.md
      - License: license.md

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_symbol_type_heading: true
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

watch:
  - django_celery_results_redis
