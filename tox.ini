[tox]
requires =
    tox>=4.2
    tox-uv>=1.11
env_list =
    lint
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61}
    py313-django61-celery55

[testenv]
runner = uv-venv-runner
dependency_groups = test
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    celery55: celery>=5.5,<5.6
pass_env =
    REDIS_URL
commands =
    pytest {posargs:-n auto --cov --cov-report=term-missing}

[testenv:lint]
dependency_groups = lint
commands =
    ruff check .
    ruff format --check .
